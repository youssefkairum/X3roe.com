    <script>

            theme: {

                    fontFamily: {

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        #snap-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        #snap-container::-webkit-scrollbar {
            display: none;
        }

        .snap-section {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .stagger-1 { transition-delay: 0.1s; }
        .stagger-2 { transition-delay: 0.2s; }
        .stagger-3 { transition-delay: 0.3s; }
        .stagger-4 { transition-delay: 0.4s; }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black">

        </nav>
        
        <div class="pointer-events-auto flex gap-4">
            <a href="https://open.spotify.com/artist/1lPo5ruZv0OSzUx99hsSX5" target="_blank" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center hover:bg-white hover:text-black transition-colors">
                <i class="ph-fill ph-spotify-logo"></i>

            <a href="https://music.apple.com/us/artist/x3r%C5%93/1802614999" target="_blank" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center hover:bg-white hover:text-black transition-colors">
                <i class="ph-fill ph-apple-logo"></i>

                    <div class="group reveal stagger-3">

        </section>

        <!-- Section 3: LISTEN -->
        <section id="listen" class="snap-section bg-black border-t border-white/5">
            <div class="max-w-4xl w-full mx-auto px-6 text-center z-10">
                <div class="reveal">
                    <h2 class="text-5xl sm:text-7xl font-black tracking-tighter text-white mb-16">
                        Listen Everywhere.

                </div>
                
                <div class="flex flex-wrap justify-center items-center gap-12 sm:gap-20 reveal stagger-1">
                    <a href="https://open.spotify.com/artist/1lPo5ruZv0OSzUx99hsSX5" target="_blank" class="text-white/40 hover:text-white transition-colors" title="Spotify">

                    <a href="https://music.apple.com/us/artist/x3r%C5%93/1802614999" target="_blank" class="text-white/40 hover:text-white transition-colors" title="Apple Music">
                        <svg class="w-14 h-14 fill-current" viewBox="0 0 384 512">
                            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 52.3-11.4 69.5-34.3z"/>

    </main>

    <script>
        const observerOptions = {
            root: document.getElementById('snap-container'),
            rootMargin: '0px',
            threshold: 0.5
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.querySelectorAll('.reveal').forEach(el => {
                        el.classList.add('active');
                    });
                }
            });
        }, observerOptions);

        document.querySelectorAll('.snap-section').forEach(section => {
            observer.observe(section);
        });
        
        setTimeout(() => {
            document.getElementById('latest').querySelectorAll('.reveal').forEach(el => {
                el.classList.add('active');
            });
        }, 100);
    </script>
</body>
</html>
