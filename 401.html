<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {

                        sans: ['Inter', 'sans-serif'],

                    colors: {

    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }

<body class="antialiased selection:bg-white selection:text-black flex items-center justify-center relative">
    
    <!-- Fixed UI Overlay -->
    <header class="fixed top-0 left-0 right-0 z-50 p-6 sm:p-10 flex justify-between items-center pointer-events-none">

    </div>
    
    <div class="max-w-4xl w-full px-6 text-center z-10">

    </div>
